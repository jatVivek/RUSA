<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rusa-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="rusa-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="rusa-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="rusa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal / Prism Frame -->
  <path
    d="M60 6 L108 33.5 V86.5 L60 114 L12 86.5 V33.5 Z"
    stroke="url(#rusa-grad-primary)"
    stroke-width="3"
    stroke-linejoin="round"
    fill="#131316"
    fill-opacity="0.9"
  />

  <!-- Subtle Inner Hex Accent -->
  <path
    d="M60 16 L98 38 V82 L60 104 L22 82 V38 Z"
    stroke="url(#rusa-grad-primary)"
    stroke-width="1"
    stroke-opacity="0.3"
    fill="none"
  />

  <!-- Stylized Geometric "R" Monogram -->
  <!-- Left Spine -->
  <path
    d="M40 32 V88"
    stroke="url(#rusa-grad-primary)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Upper Loop -->
  <path
    d="M40 36 H64 C76 36 82 44 82 52 C82 60 75 66 64 66 H40"
    stroke="url(#rusa-grad-primary)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- High-Speed Dynamic Diagonal Leg -->
  <path
    d="M58 64 L79 88"
    stroke="url(#rusa-grad-accent)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Quantum Core Pulse / Orbital Node -->
  <circle cx="60" cy="51" r="3.5" fill="#06b6d4" filter="url(#rusa-glow)" />
  <circle cx="108" cy="33.5" r="2.5" fill="#06b6d4" />
  <circle cx="60" cy="114" r="2.5" fill="#8b5cf6" />
  <circle cx="12" cy="33.5" r="2.5" fill="#3b82f6" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rusa-dark-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="rusa-dark-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="rusa-dark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <path
    d="M60 6 L108 33.5 V86.5 L60 114 L12 86.5 V33.5 Z"
    stroke="url(#rusa-dark-primary)"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="#0e0e10"
    fill-opacity="0.95"
  />

  <!-- Subtle Inner Guide -->
  <path
    d="M60 17 L97 38.5 V81.5 L60 103 L23 81.5 V38.5 Z"
    stroke="url(#rusa-dark-primary)"
    stroke-width="1"
    stroke-opacity="0.35"
    fill="none"
  />

  <!-- Stylized Geometric "R" Monogram -->
  <path
    d="M40 32 V88"
    stroke="url(#rusa-dark-primary)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M40 36 H64 C76 36 82 44 82 52 C82 60 75 66 64 66 H40"
    stroke="url(#rusa-dark-primary)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M58 64 L79 88"
    stroke="url(#rusa-dark-accent)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Core Pulse Nodes -->
  <circle cx="60" cy="51" r="3.5" fill="#22d3ee" filter="url(#rusa-dark-glow)" />
  <circle cx="108" cy="33.5" r="2.5" fill="#22d3ee" />
  <circle cx="60" cy="114" r="2.5" fill="#a78bfa" />
  <circle cx="12" cy="33.5" r="2.5" fill="#38bdf8" />
</svg>
